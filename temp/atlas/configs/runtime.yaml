version: 1
seed: 42
workers: 1
torch_threads: 2
batch_size: 1
backbone: mbnetv3
max_upload_mb: 100
# Порог уверенности детектора лица. С 2026-10-24 детектор — RetinaFace
# (ResNet-50, вход 512) вместо OpenCV YuNet: YuNet не находил лица,
# занимающие больше ~70% кадра. Значение входит в ключ кэша признаков
# (server/storage.py:key_for), поэтому его смена перегенерирует обработку.
detector_confidence: 0.7
# Экспериментальный metric-слой: доворачивает уже канонический меш identity
# к yaw-центру pose-бина. Замер на калибровке показал падение AUC
# 0.695 -> 0.511, поэтому по умолчанию выключен (см. reports/calibration-check.md).
metric_layer: false
# Режим heatmap. Значения карты считает server/heat.py — один код на
# preview (/api/photos/{id}/preview), export (server/rendering.py) и harness.
# Baseline: euclid без весов. Кандидат: normal + calibrated, профиль
# reports/calibration/weights.json (см. reports/calibration-v3.md).
# Калибровка меняет только start_values/end_values: вершины и морф не трогаются.
heatmap:
  metric: euclid
  weighting: none
  calibration_profile: reports/calibration/weights.json
# Ряд графика Timeline. Считает server/chart.py поверх server/heat.py —
# второго расчёта в браузере нет. temporal_filter работает только на
# отображении: value_raw сохраняется отдельно (см. reports/calibration-v4.md).
chart:
  metric: euclid
  weighting: none
  temporal_filter: none
  filter_window: 3
  calibration_profile: reports/calibration/weights.json
