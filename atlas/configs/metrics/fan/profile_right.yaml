version: 1
model: fan
pose: profile_right
profile_defaults:
  normalize: iod
  zscore: robust_mad
metrics:
- id: fan_eye_area
  enabled: true
  title: Площадь глаз / IOD²
  unit: IOD²
  thresholds:
    warn: 2.0
    alert: 3.0
- id: fan_jaw_ratio
  enabled: true
  title: Нижняя челюсть / контур
  unit: ratio
  thresholds:
    warn: 2.0
    alert: 3.0
- id: fan_nose_projection
  enabled: true
  title: Проекция носа / IOD
  unit: IOD
  thresholds:
    warn: 2.0
    alert: 3.0
