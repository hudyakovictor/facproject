[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeputin-observatory"
version = "0.1.0"
description = "Local journalist-first observability and iteration manager for app6"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "structlog>=24,<26",
  "watchfiles>=0.21,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
dpo = "dpo.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
