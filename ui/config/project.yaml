schema: dpo-project-config-v1

project:
  app6_root: ../app6
  read_only_observation: true

storage:
  control_root: ../ui/.data
  heavy_root: /Volumes/SDCARD/uidata
  required_volume:
    mount_path: /Volumes/SDCARD
    fail_closed: true
    verify_volume_identity: true
    verify_writable: true
    verify_free_space: true
    allow_local_fallback: false
  heavy_directories:
    - runs
    - stage1
    - stage2
    - stage2b
    - stage3
    - test-cache
    - scenarios
    - calibration
    - artifacts
    - previews
    - backups
    - trash
  local_control_only:
    - studio.sqlite
    - layouts
    - compact-logs
    - manifests

datasets:
  main:
    root: /Volumes/SDCARD/photo/main
    role: research_main
    copy_photos_to_uidata: false
  calibration:
    root: /Volumes/SDCARD/calibration
    photos_subdir: photos
    expected_people: 7
    copy_photos_to_uidata: false
    index_candidates:
      - all_calibration_index.csv
    table_trust:
      trusted_fields:
        - main_photo_id
        - calibration_photo_id
        - dataset_id
        - record_id
        - source_filename
        - frame_index
        - pair_id
        - pair_role
        - yaw
        - pitch
        - roll
      derived_fields:
        pose_bin: recompute_from_trusted_angles
      forbidden_as_geometry_input:
        - landmark_coordinates
        - keypoint_coordinates
        - mesh_coordinates
        - x
        - y
        - z
      unknown_field_policy: requires_review

analysis:
  production_run_group:
    members:
      - main_dataset
      - calibration_person_01
      - calibration_person_02
      - calibration_person_03
      - calibration_person_04
      - calibration_person_05
      - calibration_person_06
      - calibration_person_07
    fresh_stage1_extraction: always
    require_same_code_hash: true
    require_same_model_hash: true
    require_same_extraction_config_hash: true
    reject_stale_calibration_geometry: true

test_profiles:
  synthetic_3d:
    source: app6/test_module/synthetic_runner.py
    purpose: numerical_contract_regression_only
    may_set_forensic_thresholds: false
  fresh_5:
    photo_count_target: 5
    fresh_stage1_extraction: true
    purpose: fast_full_pipeline_development_check
  combination_1:
    combinations: 1
  combination_3:
    combinations: 3
  combination_7:
    combinations: 7
    require_balanced_seven_person_rotation: true
  all_poses:
    pose_bins: 9
  cached_stage2_fast:
    permitted_for:
      - stage2
      - stage2b
      - stage3
    may_verify_stage1: false

export:
  policy_file: ./export_policy.example.yaml
