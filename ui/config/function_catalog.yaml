schema: dpo-function-catalog-v1
functions:
  app6.stage1.engine.Stage1Engine.run:
    title: Запустить извлечение данных из фотографий
    description: Последовательно обрабатывает исходные фотографии и формирует проверяемые результаты Stage 1.
    why_important: Это главный вход в извлечение геометрии, ракурса и служебных метаданных.
    failure_impact: Анализ может получить неполные или несогласованные данные по фотографиям.
    criticality: critical
  app6.stage1.reconstruction.ReconstructionEngine.process:
    title: Восстановить 3D-геометрию лица
    description: Запускает 3DDFA-V3 и получает landmarks, mesh и параметры позы для одной фотографии.
    why_important: Все последующие сравнения формы зависят от корректности этого результата.
    failure_impact: Ошибка делает геометрические сравнения недостоверными.
    criticality: critical
  app6.stage2.core.compare_landmarks:
    title: Сравнить форму лица по ключевым точкам
    description: Сопоставляет нормализованные landmarks двух фотографий с учётом применимости пары.
    why_important: Это один из основных геометрических каналов сравнения.
    failure_impact: Шум ракурса может быть ошибочно принят за различие формы.
    criticality: critical
  app6.stage2.evidence.evidence_state:
    title: Определить допустимую силу вывода
    description: Преобразует качество и применимость результата в ограниченное доказательное состояние.
    why_important: Не позволяет интерфейсу показывать более сильный вывод, чем поддерживают данные.
    failure_impact: Возможна чрезмерно уверенная или некорректная журналистская интерпретация.
    criticality: critical

glossary:
  landmark: Ключевая точка лица, извлечённая моделью.
  mesh: Трёхмерная сетка поверхности лица.
  pose: Положение головы по yaw, pitch и roll.
  residual: Остаточное различие после предусмотренной коррекции.
  calibration: Проверка поведения метрики на контрольных парах фотографий.
  heuristic: Связь, предполагаемая статическим анализом, но не доказанная выполнением.
