# DEV_FIX_TZ P3.21: в проекте не было ни одного статического анализатора
# Python (ruff/flake8/pyflakes), поэтому опечатки в редко исполняемых ветках
# — например `-copy` в `parse_photo_name` — доживали до рантайма.
#
# Здесь настраивается только ruff: он заменяет и flake8, и pyflakes, и isort,
# и работает без дополнительных плагинов.
#
# Запуск:
#   pip install -r requirements-dev.txt
#   ruff check app6 uv_module
#   ruff check --fix app6            # безопасные автоисправления
[tool.ruff]
line-length = 120
target-version = "py311"

# Вендорённые сторонние репозитории и сгенерированные артефакты не наши —
# приводить их к нашему стилю нельзя, это затруднит слияние с апстримом.
exclude = [
    ".venv",
    "3ddfa_v3/face_box",
    "3ddfa_v3/model",
    "3ddfa_v3/util",
    "FFHQ-detect-face-wrinkles/face-parsing.PyTorch",
    "FFHQ-detect-face-wrinkles/unet",
    "runs",
    "ui/node_modules",
]

[tool.ruff.lint]
# Базовый набор намеренно сфокусирован на ДЕФЕКТАХ, а не на форматировании:
# такой линтер можно включить в CI как блокирующий гейт прямо сейчас.
# Стилевые правила (E7 — компактные `a; b` и `if x: y`) — осознанный стиль
# существующего кода; массовое переписывание ради них создало бы огромный
# диф без единого исправленного дефекта. Полный набор доступен по требованию:
#   ruff check --select F,E,W,I,B,UP,S,RUF app6
select = [
    "F",    # pyflakes: неопределённые имена, неиспользуемые импорты, F811
    "B",    # bugbear: логические ловушки (мутабельные дефолты, забытые переменные цикла)
    "S",    # bandit: безопасность (pickle, subprocess, tarfile, слабые хэши)
    "UP",   # pyupgrade: устаревшие конструкции
]
ignore = [
    "E501",    # длину строк контролирует line-length, дубль не нужен
    "S101",    # assert допустим в тестах и внутренних инвариантах
    "B008",    # Depends()/File() в аргументах — идиома FastAPI
    "RUF001",  # кириллица в строках — язык проекта, не «неоднозначный символ»
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Тесты: магические значения и длинные фикстуры — норма.
"app6/test_module/*" = ["S", "B011"]
"app6/api/tests/*" = ["S", "B011"]
# Вспомогательные скрипты 3DDFA/FFHQ: импорты после настройки sys.path —
# вынужденная необходимость (апстрим требует корня в sys.path).
"3ddfa_v3/*.py" = ["E402"]
"FFHQ-detect-face-wrinkles/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["app6/test_module", "app6/api/tests"]
